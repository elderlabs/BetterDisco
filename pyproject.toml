[project]
name = "betterdisco-py"
description = "A Discord API library, written in Python, for those that like to dance. [QUEUE COWBOY BEBOP THEME]"
version = "2025.09.24"
requires-python = ">= 3.10"
license = {text = "MIT License"}
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["discord", "disco", "disco-py", "bdisco", "betterdisco", "betterdisco-py"]
dynamic = ["dependencies",]

authors = [
    {name = "Andrei Zbikowski"},
]
maintainers = [
    {name = "The BetterDisco Team"},
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
all = ["betterdisco-py[http,performance,sharding,voice,yaml]"]
http = ["flask >= 3.1.2",]
performance = ["erlpack >= 1.0.1", "isal >= 1.8.0", "regex >= 2025.9.18", "pylibyaml >= 0.1.0", "ujson >= 5.11.0", "wsaccel >= 0.6.7",]
redis = ["redis >= 6.2.0", "hiredis >= 3.2.1",]
sharding = ["gipc >= 1.8.0", "dill >= 0.3.8",]
voice = ["libnacl >= 2.1.0", "audioop-lts; python_version >= '3.13'", "davey >= 0.1.1"]
yaml = ["pyyaml >= 6.0.2",]

[project.urls]
Repository = "https://github.com/elderlabs/BetterDisco.git"

[build-system]
requires = ["setuptools >= 80.9.0", "wheel >= 0.45.1",]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
include = ["disco*",]
namespaces = false
