[project]
name = "betterdisco-py"
description = "A Discord API library, written in Python, for those that like to dance. [QUEUE COWBOY BEBOP THEME]"
version = "2025.09.24"
requires-python = ">= 3.10"
license = {text = "MIT License"}
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["discord", "disco", "disco-py", "bdisco", "betterdisco", "betterdisco-py"]
dynamic = ["dependencies",]

authors = [
    {name = "Andrei Zbikowski"},
]
maintainers = [
    {name = "The BetterDisco Team"},
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
all = ["betterdisco-py[http,performance,sharding,voice,yaml]"]
http = ["flask >= 3.1.3",]
performance = ["brotli >= 1.2.0", "erlpack >= 1.0.1", "isal >= 1.8.0", "pylibyaml >= 0.1.0", "orjson >= 3.11.8", "regex >= 2026.4.4", "wsaccel >= 0.6.7", "zstandard >= 0.25.0; python_version < '3.14'",]
redis = ["redis >= 7.4.0", "hiredis >= 3.3.1",]
sharding = ["dill >= 0.3.8", "gipc >= 1.8.0", "psutil >= 7.2.2"]
voice = ["audioop-lts >= 0.2.2; python_version >= '3.13'", "davey >= 0.1.5", "libnacl >= 2.1.0",]
yaml = ["pyyaml >= 6.0.3",]

[project.urls]
Repository = "https://github.com/elderlabs/BetterDisco.git"

[build-system]
requires = ["setuptools >= 81.0.0", "wheel >= 0.46.3",]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
include = ["disco*",]
namespaces = false
